        srparasites:assimilated_flesh;40;1;1;false
        srparasites:lurecomponent2;5;1;1;true
        srpcalamity:tiercore_sim;60;1;1;true
     >

    # Mob the Assimilated Fox spawns when killed. Ex. "minecraft:zombie;4;2" Where: 
