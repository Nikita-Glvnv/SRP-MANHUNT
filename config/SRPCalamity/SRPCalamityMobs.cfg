#  Base Health|基础生命值|基本の健康値: 420.0 
#  Base Damage|基础伤害值|基本のダメージ値: 33.0 
#  Base Armor|基础护甲值|基本の防御値: 15.5 
#  Base Knockback Resistance|基础抗击退值|基本のノックバック: 0.15
##########################################################################################################

"srparasites:anc_bomber" {
    # Armor multiplier for Ancient Bomber. 
    # 远古轰炸魔的护甲值系数。 
    # 太古爆擊魔の防御値の係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Ancient Bomber Armor Multiplier"=1.0

    # Damage multiplier for Ancient Bomber. 
    # 远古轰炸魔的伤害值系数。 
    # 太古爆擊魔のダメージ値の係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Ancient Bomber Damage Multiplier"=1.0

    # Set to false if you want to disable Ancient Bomber. 
    # 启用远古轰炸魔。 
    # エネーブル太古爆擊魔。 [default: true]
    B:"Ancient Bomber Enabled"=true

    # Set to true if you want the Ancient Bomber to destroy blocks on explosion. [default: true]
    B:"Ancient Bomber Griefing"=true

    # Health multiplier for Ancient Bomber. 
    # 远古轰炸魔的生命值系数。 
    # 太古爆擊魔の健康値の係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Ancient Bomber Health Multiplier"=1.0

    # Knockback Resistance multiplier for Ancient Bomber. 
    # 远古轰炸魔的抗击退系数。 
    # 太古爆擊魔のノックバック係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Ancient Bomber Knockback Resistance Multiplier"=1.0

    # Items you want the Ancient Bomber to drop. Ex. "minecraft:end_crystal;100;1;3;false" 
    # 妳想让远古轰炸魔掉落的物品。 例如："minecraft:end_crystal;100;1;3;false" 
    # 太古爆擊魔にドロップさせたいアイテム。 例えば："minecraft:end_crystal;100;1;3;false" 
    #  Where: 
    #  此处： 
    #  ここは： 
    #  "minecraft:end_crystal" is the item, 
    #  "minecraft:end_crystal" 是物品， 
    #  "minecraft:end_crystal" はアイテムです。 
    #  "100" is the chance to drop, 
    #  "100" 是掉落几率, 
    #  "100" はドロップするチャンスです。 
    #  "1" is the min number of items, 
    #  "1" 是物品的最小掉落数， 
    #  "1" はアイテムの最小数です， 
    #  "3" is the max number of items, 
    #  "3" 是物品的最大掉落数， 
    #  "3" はアイテムの最大数です， 
    #  "true" is for the item to always roll, if false the item will be unique and only 1 will be choosen. 
    #  "true" 意味着物品一直可能掉落，如果为 false 则此独特物品掉落时只有自己。 
    #  "true" はアイテムが常にロールするためであり、falseの場合、アイテムは一意になり、1つだけが選択されます。 
    #  [default: ]
    S:"Ancient Bomber Loot Table" <
     >

    # Orb effects  Ex. "0;60;2;minecraft:fire_resistance;4;3" Where: 
    #  "0" mode of applying, 0 to non parasite mobs, 1 to self, 2 to parasite mobs, 
    #  "60" potion duration in seconds, 
    #  "2" potion amplifier, 
    #  "minecraft:fire_resistance" potion itself, 
    #  "4" if != 0 then amplifier += (mobs inside the orb / this value), 
    #  "3" if != 0 then amplifier += (mobs inside the orb / this value) * 20. 
    #  [default: [0;30;4;minecraft:hunger;0;0], [0;240;4;srparasites:needler;0;0], [0;30;4;minecraft:mining_fatigue;0;0], [0;20;4;minecraft:wither;0;0]]
    S:"Ancient Bomber Orb Effects" <
        0;30;4;minecraft:hunger;0;0
        0;240;4;srparasites:needler;0;0
        0;30;4;minecraft:mining_fatigue;0;0
        0;20;4;minecraft:wither;0;0
     >
}


