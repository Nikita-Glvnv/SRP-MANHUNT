    # 自然生成所至少需要的同化种数量。
    # 自然にスポーンするために必要な降伏種の数。 [range: 0 ~ 100, default: 6]
    I:"Assimilated Pillager Needed Assimilation Value"=6

    # Spawn rate for Assimilated Pillager (This value is ignored if Evolution Phases are enabled, it has its own option). 
