    # Percentage of health Walking Pillager Head will have from the host. 
    # 行走掠夺者头颅的生命值与主体生命值的百分比。 
    # 刌人の歩く頭の健康値は、ホストの健康値の割合です。 [range: 0.01 ~ 100.0, default: 0.3]
    S:"Walking Pillager Head Health"=0.3

    # Items you want the Walking Pillager Head to drop. Ex. "minecraft:end_crystal;100;1;3;false" 
    # 妳想让行走掠夺者头颅掉落的物品。 例如："minecraft:end_crystal;100;1;3;false" 
    # 刌人の歩く頭にドロップさせたいアイテム。 例えば："minecraft:end_crystal;100;1;3;false" 
    #  Where: 
    #  此处： 
    #  ここは： 
    #  "minecraft:end_crystal" is the item, 
    #  "minecraft:end_crystal" 是物品， 
    #  "minecraft:end_crystal" はアイテムです。 
    #  "100" is the chance to drop, 
    #  "100" 是掉落几率, 
    #  "100" はドロップするチャンスです。 
    #  "1" is the min number of items, 
    #  "1" 是物品的最小掉落数， 
    #  "1" はアイテムの最小数です， 
    #  "3" is the max number of items, 
    #  "3" 是物品的最大掉落数， 
    #  "3" はアイテムの最大数です， 
    #  "true" is for the item to always roll, if false the item will be unique and only 1 will be choosen. 
    #  "true" 意味着物品一直可能掉落，如果为 false 则此独特物品掉落时只有自己。 
    #  "true" はアイテムが常にロールするためであり、falseの場合、アイテムは一意になり、1つだけが選択されます。 
    #  [default: ]
