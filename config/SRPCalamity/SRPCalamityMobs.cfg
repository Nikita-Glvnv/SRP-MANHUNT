    # Percentage of damage Walking Pillager Head will have from the host. 
    # 行走掠夺者头颅的伤害值与主体伤害值的百分比。 
    # 刌人の歩く頭のダメージ値は、ホストのダメージ値の割合です。 [range: 0.01 ~ 100.0, default: 0.3]
