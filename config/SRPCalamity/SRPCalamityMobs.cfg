    # 被同化的掠夺者的伤害值系数。 
    # 同化された刌人のダメージ値の係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Assimilated Pillager Damage Multiplier"=1.0

    # Set to false if you want to disable Assimilated Pillager. 
    # 启用被同化的掠夺者。 
    # エネーブル同化された刌人。 [default: true]
    B:"Assimilated Pillager Enabled"=true

    # Health multiplier for Assimilated Pillager. 
    # 被同化的掠夺者的生命值系数。 
    # 同化された刌人の健康値の係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Assimilated Pillager Health Multiplier"=1.0

    # Knockback Resistance multiplier for Assimilated Pillager. 
    # 被同化的掠夺者的抗击退系数。 
    # 同化された刌人のノックバック係数。 [range: 0.01 ~ 100.0, default: 1.0]
    S:"Assimilated Pillager Knockback Resistance Multiplier"=1.0

    # Items you want the Assimilated Pillager to drop. Ex. "minecraft:end_crystal;100;1;3;false" 
    # 妳想让被同化的掠夺者掉落的物品。 例如："minecraft:end_crystal;100;1;3;false" 
