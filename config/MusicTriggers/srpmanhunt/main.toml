# Optimized SRP Manhunt configuration for Music Triggers 1.12.2
# Duplicate and invalid triggers removed; expensive mob scan boxes reduced.

# Patched mod: all due mob triggers share one scan. Exact IDs use =, prefixes use *, exclusions use !.
