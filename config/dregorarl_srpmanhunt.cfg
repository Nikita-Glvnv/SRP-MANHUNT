# Configuration file

"city vehicles" {
    # Chance that a generated patrol marker creates a tank. Nearby-patrol spacing is applied afterwards. [range: 0 ~ 100, default: 12]
    I:"City patrol marker chance percent"=12

    # MCHeli tank content name used by rare stationary NPC gun platforms. [default: m1a2]
    S:"City patrol tank type"=m1a2

    # Chance that a rare parked car contains 20-70 percent fuel. Other generated parked cars are empty. [range: 0 ~ 100, default: 20]
    I:"Fueled parked car chance percent"=20

    # Minimum horizontal distance in blocks between loaded generated patrol tanks. [range: 32 ~ 512, default: 144]
    I:"Minimum city patrol spacing"=144

    # Minimum horizontal distance in blocks between loaded generated parked cars. [range: 16 ~ 256, default: 64]
    I:"Minimum parked car spacing"=64

    # Chance that a generated parked-car marker creates a vehicle. [range: 0 ~ 100, default: 24]
    I:"Parked car marker chance percent"=24

    # Comma-separated MCHeli tank-content names. CE 1.5 ships bnr32 and growler as CAR-weight ground vehicles. [default: bnr32,growler]
    S:"Parked car types"=bnr32,growler
}


debug {
    # When enabled, logs generated encounter marker coordinates, biome, kind, military radius and reward tier for test-world audits. [default: false]
    B:"Enable runtime encounter audit"=false
}


encounters {
    # Convert hidden OTG encounter markers into faction-aware defenders, vehicles and patrols. [default: true]
    B:"Enable generated encounters"=true

    # Maximum health of the unique MCHeli boss. This is applied to a per-entity info copy. [range: 300 ~ 20000, default: 1400]
    I:"Vagrant boss helicopter health"=1400

    # MCHeli helicopter content name used by the Brutal Tower boss marker. [default: mi28]
    S:"Vagrant boss helicopter type"=mi28

    # Comma-separated MCHeli helicopter content names used by normal garrison markers; one is selected per spawn. [default: mi-24,ka-29,mh-60l_dap,ka52]
    S:"Vagrant guard helicopter type"=mi-24

    # Comma-separated MCHeli tank content names used by normal garrison markers; one is selected per spawn. [default: m1a2,t-90,merkava_mk4,kurganets25,centauro,m1129]
    S:"Vagrant guard tank type"=m1a2
}


"military defenses" {
    # OTG-only target range for mounted MCHeli NPC gunners. Vagrants are selected from the loaded player list once per second; no native broad MCHeli target scan is used. [range: 48 ~ 256, default: 192]
    I:"Aircraft gunner target range"=192

    # Comma-separated MCHeli weapon content names used by foot garrisons. Weighted list; default favors 7.62mm MG, then M60, M240 and MG3. [default: mg7_62mm,mg7_62mm,mg7_62mm,mg7_62mm,m60_r,m60_r,m240_r,mg3_r]
    S:"Foot gunner MCHeli weapon types"=mg7_62mm,m60_r

    # Maximum line-of-sight range for autonomous foot-gunner shots. [range: 8 ~ 96, default: 48]
    I:"Foot gunner firing range"=48

    # Horizontal patrol and pursuit speed multiplier. [range: 30 ~ 180, default: 100]
    I:"Foot gunner move speed percent"=100

    # Maximum patrol distance from the generated garrison marker. [range: 4 ~ 48, default: 18]
    I:"Foot gunner patrol radius"=18

    # Minimum delay between real MCHeli machine-gun shots fired by autonomous foot gunners. [range: 3 ~ 100, default: 8]
    I:"Foot gunner shot cooldown ticks"=24

    # Legacy compatibility setting. Foot garrisons now fire the configured real MCHeli weapon, whose damage comes from its MCHeli weapon config. [range: 1 ~ 30, default: 6]
    I:"Foot gunner shot damage"=6

    # Range in blocks for Vagrant, SRParasites and hostile vanilla-mob acquisition. [range: 16 ~ 192, default: 96]
    I:"Foot gunner target range"=96

    # Number of autonomous MCHeli gunners in each generated foot-garrison squad. [range: 1 ~ 6, default: 2]
    I:"Foot gunners per marker"=2

    # Chance that a military-site marker creates an armed MCHeli tank with a faction-aware gunner. [range: 0 ~ 100, default: 65]
    I:"Military vehicle marker chance percent"=65

    # Minimum horizontal distance in blocks between loaded generated military vehicles. [range: 24 ~ 256, default: 72]
    I:"Minimum military vehicle spacing"=72

    # Smaller spacing used when another military anchor is already close to the vehicle marker. [range: 8 ~ 48, default: 20]
    I:"Minimum vehicle spacing inside one military compound"=20

    # Comma-separated MCHeli vehicle content names used by reinforced watchtowers. The default VADS is a compact Vulcan air-defense turret. [default: vads]
    S:"Watchtower static turret type"=vads
}


"structure rewards" {
    # Maximum distance for an eligible Vagrant near a destroyed MCHeli structure boss. [range: 24 ~ 256, default: 128]
    I:"Boss reward eligibility range"=128

    # Nearby completed structures cannot produce another boss-clear reward until this loaded-time cooldown expires. [range: 12000 ~ 240000, default: 72000]
    I:"Full-clear reward cooldown ticks"=72000

    # Delay before the first full-clear check, allowing boss death and projectiles to settle. [range: 20 ~ 1200, default: 100]
    I:"Full-clear reward grace ticks"=100

    # Horizontal radius checked for remaining structure defenders after a tagged boss dies. [range: 24 ~ 160, default: 72]
    I:"Full-clear reward radius"=72
}


