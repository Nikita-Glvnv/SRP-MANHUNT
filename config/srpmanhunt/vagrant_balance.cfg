# Configuration file

general {

    ##########################################################################################################
    # abilities
    #--------------------------------------------------------------------------------------------------------#
    # Точечные исправления способностей. Штатные кулдауны SRPCotesia не заменяются; у эхолокации есть отдельный тихий кулдаун.
    ##########################################################################################################

    abilities {
        # Минимальный Bloom узла полного улучшенного инвиза.
        # Min: 0
        # Max: 20
        I:advancedInvisibilityMinimumBloom=6

        # Не применять цены в творческом режиме.
        B:creativeBypass=true

        # Минимальный Bloom мутации, открывающей создание новой Factory тира 0.
        # Min: 0
        # Max: 20
        I:factoryMinimumBloom=0

        # Постоянная цена каждой секунды улучшенного инвиза.
        # Min: 0
        # Max: 1000000
        I:hidingBiomassPerSecond=2

        # Запрещать атаки и нанесение урона во время инвиза.
        B:hidingBlocksAttacks=true

        # Запрещать разрушение блоков во время инвиза.
        B:hidingBlocksBreaking=true

        # Не расходовать биомассу инвиза в творческом режиме.
        B:hidingCreativeBypass=true

        # Устаревшая опция совместимости. Должна оставаться false: расход инвиза постоянный.
        B:hidingExponentialDrain=false

        # Подавлять звуки шагов и тряску камеры во время улучшенного инвиза.
        B:hidingHoverMovement=true

        # Ускорение во время улучшенного инвиза. 0.25 = +25% к скорости передвижения.
        # Min: 0.0
        # Max: 3.0
        D:hidingSpeedBonus=0.3

        # Дополнительная стоимость, если улучшенный взгляд успешно создал Seizer.
        # Min: 0
        # Max: 1000
        I:improvedLeerExtraBiomassCost=6

        # Минимальный Bloom узла улучшенного взгляда с Seizer.
        # Min: 0
        # Max: 20
        I:improvedLeerMinimumBloom=9

        # Стоимость успешного выпуска Latch. Возврат Latch бесплатный.
        # Min: 0
        # Max: 1000
        I:latchBiomassCost=12

        # Минимальный Bloom узла Latch.
        # Min: 0
        # Max: 20
        I:latchMinimumBloom=4

        # Стоимость только успешно выполненного рывка.
        # Min: 0
        # Max: 1000
        I:leapBiomassCost=2

        # Минимальный Bloom узла обычного рывка.
        # Min: 0
        # Max: 20
        I:leapMinimumBloom=5

        # Стоимость успешного использования обычного пристального взгляда.
        # Min: 0
        # Max: 1000
        I:leerBiomassCost=2

        # Минимальный Bloom узла обычного пристального взгляда.
        # Min: 0
        # Max: 20
        I:leerMinimumBloom=3

        # Bloom, на котором ветка Пасти разрешает приобрести обычную маскировку Cotesia.
        # Min: 0
        # Max: 20
        I:maskingMinimumBloom=0

        # Точная цена успешно созданного Orb. В комплектном srpcotesia.cfg нативная цена обнулена, чтобы исключить списание при неудачном спавне.
        # Min: 0
        # Max: 1000
        I:orbBiomassCost=10

        # Минимальный Bloom узла Orb.
        # Min: 0
        # Max: 20
        I:orbMinimumBloom=6

        # Стоимость успешного запуска усиленного рывка. Отдельный кулдаун не добавляется.
        # Min: 0
        # Max: 1000
        I:spikedDashBiomassCost=8

        # Урон каждой протараненной цели. Одна цель получает его не больше одного раза за рывок.
        # Min: 0.0
        # Max: 1000.0
        D:spikedDashDamage=12.0

        # Максимальная длительность активного тарана после раскрытия, в тиках.
        # Min: 2
        # Max: 40
        I:spikedDashDurationTicks=11

        # Включить шипованный усиленный рывок вместо обычного, начиная с указанного Bloom.
        B:spikedDashEnabled=true

        # Дополнительный радиус корпуса и шипов при поиске столкновения.
        # Min: 0.0
        # Max: 3.0
        D:spikedDashHitRadius=0.65

        # Сила отбрасывания протараненной цели.
        # Min: 0.0
        # Max: 8.0
        D:spikedDashKnockback=1.65

        # Максимум целей, которые можно протаранить одним усиленным рывком.
        # Min: 1
        # Max: 32
        I:spikedDashMaxTargets=4

        # Минимальный Bloom узла шипованного тарана.
        # Min: 0
        # Max: 20
        I:spikedDashMinimumBloom=9

        # Горизонтальная скорость усиленного рывка в блоках за тик.
        # Min: 0.2
        # Max: 4.0
        D:spikedDashSpeed=1.45

        # Короткое раскрытие шипов перед броском, в тиках.
        # Min: 0
        # Max: 20
        I:spikedDashWarmupTicks=3

        # Точная цена успешно созданного Succor.
        # Min: 0
        # Max: 1000
        I:succorBiomassCost=45

        # Минимальный Bloom узла Succor/телепорта.
        # Min: 0
        # Max: 20
        I:succorMinimumBloom=10
    }

    ##########################################################################################################
    # echolocation
    #--------------------------------------------------------------------------------------------------------#
    # Клиентская эхолокация в стиле Dying Light. Проверяет сущности только при нажатии клавиши и не добавляет серверных тиковых обработчиков.
    ##########################################################################################################

    echolocation {
        # Стоимость одного успешного импульса эхолокации.
        # Min: 0
        # Max: 1000
        I:biomassCost=3

        # Базовый серверный кулдаун эхолокации в тиках. 80 = 4 секунды. HUD, таймер и сообщения не показываются.
        # Min: 0
        # Max: 12000
        I:cooldownTicks=80

        # Клавиша LWJGL. 47 = V. Клавишу также можно переназначить в меню управления.
        # Min: 1
        # Max: 255
        I:defaultKeyCode=47

        # Длительность импульсной волны и цветных отметок, в миллисекундах.
        # Min: 250
        # Max: 10000
        I:durationMs=2800

        # Включить эхолокацию.
        B:enabled=true

        # Максимальное количество отмечаемых существ за одно использование.
        # Min: 1
        # Max: 256
        I:maxTargets=44

        # Минимальный Bloom узла эхолокации.
        # Min: 0
        # Max: 20
        I:minimumBloom=2

        # Радиус обнаружения ближайших существ.
        # Min: 4.0
        # Max: 128.0
        D:radius=28.0

        # Случайно немного менять высоту звука.
        B:randomPitch=true

        # Громкость случайного паразитического рыка.
        # Min: 0.0
        # Max: 4.0
        D:soundVolume=0.9

        # Устаревшая опция совместимости. Серый фильтр отключён и не используется.
        B:useDesaturateShader=false
    }

    ##########################################################################################################
    # pearl
    #--------------------------------------------------------------------------------------------------------#
    # Ограниченный Macabre Pearl: постоянный отряд, безопасный вызов и общий лимит по Bloom.
    ##########################################################################################################

    pearl {
        # Min: 0
        # Max: 1000
        I:bindBiomassCost=0
        I:commandCapacityByBloom <
            0
            0
            0
            4
            6
            8
            12
            16
            24
            32
            40
         >
        B:enabled=true
        I:maxParasiteTierByBloom <
            0
            0
            0
            1
            2
            3
            4
            5
            6
            7
            127
         >

        # Min: 0
        # Max: 1000
        I:recallBaseCost=2

        # Min: 0
        # Max: 1000
        I:recallPointsPerExtraBiomass=4

        # Min: 1.0
        # Max: 512.0
        D:recallRadius=96.0
        B:rejectStationary=true
        B:rejectUnregisteredLoyal=true

        # Min: 0
        # Max: 8760
        I:staleReservationHours=168
    }

    ##########################################################################################################
    # commandbudget
    #--------------------------------------------------------------------------------------------------------#
    # Единый бюджет активного управления: Pearl, Leer, congregate, loyal-follow и призванные помощники используют один лимит. Тиковых обработчиков нет.
    ##########################################################################################################

    commandbudget {
        # Min: 1
        # Max: 3600
        I:commandLeaseSeconds=30
        B:enabled=true
        B:enforceTierAccess=true
        B:guardAllLoyalAssignments=true
        B:rejectExcessSummons=true
        B:requireManagerForCommands=false

        # Min: 0
        # Max: 8760
        I:stalePermanentReservationHours=0

        # Min: 0
        # Max: 100
        I:succorWeight=8
        S:summonRegistryNames <
            srparasites:flam
            srparasites:nak
            srparasites:seizer
         >
        S:summonWeightOverrides <
            srparasites:flam=8
            srparasites:nak=4
            srparasites:seizer=4
         >
    }

    ##########################################################################################################
    # factories
    #--------------------------------------------------------------------------------------------------------#
    # Событийные лимиты фабрик. Проверка производства выполняется только в момент, когда штатная фабрика уже готова создать паразита.
    ##########################################################################################################

    factories {
        B:blockBeforeSpawn=true
        B:countAllManagedParasites=true
        B:disableExcessFactories=true
        B:globalAcrossDimensions=true
        I:maxChildrenPerFactoryByBloom <
            0
            6
            6
            8
            10
            12
            14
            16
            18
            18
            20
         >
        I:maxChildrenPerOwnerByBloom <
            0
            8
            10
            14
            18
            24
            30
            36
            40
            40
            40
         >

        # Min: 0
        # Max: 1000
        I:maxChildrenPerOwnerChunk=8
        I:maxFactoriesByBloom <
            0
            1
            1
            1
            1
            2
            2
            2
            3
            3
            3
         >
        B:removeNewestExcess=true
    }

    ##########################################################################################################
    # progression
    #--------------------------------------------------------------------------------------------------------#
    # Прогрессия Bloom: каждое допустимое прямое убийство даёт одно базовое личное очко, после чего штатно применяется Phase Booster; убийства армии дают владельцу только биомассу.
    ##########################################################################################################

    progression {
        # Умножать личные Bloom-очки через штатный Phase Booster.
        B:applyPhaseBooster=true
        B:countCreativeModeKills=false

        # Устаревший параметр совместимости. Используется только как дополнительное разрешение для фабричной армии.
        B:creditFactoryArmyKills=false

        # Начислять личные Bloom-очки за убийства, совершённые обычными подчинёнными паразитами. Биомасса при false всё равно начисляется.
        B:creditManagedParasiteBloom=false
        B:creditOnBehalfKills=true
        B:normalizePersonalKillAwards=true

        # Min: 0
        # Max: 1000
        I:pointsPerKill=1
        B:rejectOwnManagedParasiteKills=true
        B:resetBiomassOnDeath=true
    }

    ##########################################################################################################
    # biomassrewards
    #--------------------------------------------------------------------------------------------------------#
    # Награды биомассой за убийства и пищу. Нативная фиксированная награда Cotesia за убийство отключена в комплектном конфиге.
    ##########################################################################################################

    biomassrewards {
        # Применять Phase Booster к биомассе. Выключено: усилитель влияет на личные Bloom-очки, но не раздувает расходуемый ресурс.
        B:applyPhaseBooster=false

        # Добавлять Scrying повторно поверх штатной награды. По умолчанию выключено, чтобы не было двойного бонуса.
        B:applyScryingBonus=false

        # Базовая биомасса за босса до бонусов здоровья.
        # Min: 0
        # Max: 100
        I:bossBase=16

        # Добавлять к штатной награде Cotesia бонус за сложность жертвы. Комплектный srpcotesia.cfg сохраняет базовую награду Biomass On Kill = 1.
        B:enabled=true

        # Дополнительный бонус за улучшенного моба из Apocalypse/Apotheosis-подобной системы.
        # Min: 0
        # Max: 100
        I:enhancedApocalypseMobBonus=2

        # Маркеры NBT улучшенного моба. Проверяются только один раз в момент смерти.
        S:enhancedMobNbtMarkers <
            apocalypse_enhanced
            apocalypse:enhanced
            enhancedmob
            enhanced_mob
            affix_data
            apoth.boss
            champion
            infernal
            elite
         >

        # Дополнительная биомасса от насыщения еды. Базовая часть равна питательности благодаря Hunger -> Biomass Factor = 1.0.
        # Min: 0.0
        # Max: 10.0
        D:foodSaturationBonusMultiplier=0.5

        # Биомасса за обычного агрессивного моба.
        # Min: 0
        # Max: 100
        I:hostileBase=3

        # Точные итоговые награды: registry_name=biomass. Аддон добавляет только разницу сверх nativeBiomassPerKill.
        S:killRewardOverrides <
            minecraft:ender_dragon=25
            minecraft:wither=20
         >

        # Максимальный дополнительный бонус биомассы за насыщение одного предмета еды.
        # Min: 0
        # Max: 100
        I:maximumFoodSaturationBonus=10

        # Максимальная награда биомассой с одной жертвы.
        # Min: 1
        # Max: 1000
        I:maximumPerKill=25

        # Штатная базовая награда Cotesia, которая уже будет начислена до бонуса аддона.
        # Min: 0
        # Max: 100
        I:nativeBiomassPerKill=1

        # Биомасса за нейтральное существо.
        # Min: 0
        # Max: 100
        I:neutralBase=1

        # Биомасса за пассивное или очень слабое существо.
        # Min: 0
        # Max: 100
        I:passiveBase=1

        # Биомасса за убийство обычного игрока.
        # Min: 0
        # Max: 100
        I:playerBase=20

        # Не давать биомассу за убийство собственного управляемого паразита.
        B:rejectOwnManagedVictims=true
    }

    ##########################################################################################################
    # crimsonmaw
    #--------------------------------------------------------------------------------------------------------#
    # Живая Багровая Пасть и переносимая биомасса. Выключается одним флагом без влияния на прогрессию Вагранта.
    ##########################################################################################################

    crimsonmaw {
        # Сколько тиков Пасть помнит игрока/существо, которое нанесло ей урон.
        # Min: 20
        # Max: 2400
        I:abilityThreatMemoryTicks=300

        # Радиус поиска враждебной угрозы боевыми органами Пасти.
        # Min: 4.0
        # Max: 96.0
        D:abilityThreatRadius=28.0

        # Min: 0
        # Max: 16
        I:ancientPodActiveLimit=2

        # Цена, интервал и предел одновременно падающих Ancient Drop Pod.
        # Min: 0
        # Max: 1000000
        I:ancientPodBiomassCost=320

        # Min: 100
        # Max: 24000
        I:ancientPodIntervalTicks=1000

        # Разрешить Пасти самостоятельно ловить и переваривать подходящих мобов.
        B:autonomousFeedingEnabled=true

        # Минимальная стадия Пасти для самостоятельной охоты.
        # Min: 1
        # Max: 10
        I:autonomousFeedingMinimumLevel=1

        # Цена Командного сердца из запаса Пасти.
        # Min: 0
        # Max: 2000000000
        I:commandOrganBiomassCost=3500

        # Минимальный текущий Bloom для Командного сердца.
        # Min: 0
        # Max: 20
        I:commandOrganMinimumBloom=8

        # Минимальная стадия Пасти для Командного сердца.
        # Min: 1
        # Max: 10
        I:commandOrganMinimumMawLevel=3

        # Сделать Пасть и её транспортную сеть общими для всех игроков,
        # которые реально находятся в паразитном состоянии Cotesia. Scoreboard-команды не используются.
        B:communityMaw=true

        # Дополнительная фиксированная цена межпространственного перемещения.
        # Min: 0
        # Max: 1000000
        I:crossDimensionBiomassCost=80

        # Разрешить межпространственное перемещение только после достижения III стадии Пасти.
        B:crossDimensionTransportAtLevelThree=true

        # Максимум биомассы в одном живом сосуде.
        # Min: 20
        # Max: 2000000000
        I:cystCapacity=99999

        # Доля накопленной биомассы, которая выпадает в наполненных сосудах при разрушении Пасти. Остальная часть погибает.
        # Min: 0.0
        # Max: 1.0
        D:destroyedBiomassDropFraction=0.5

        # Время уязвимой подготовки межмирового прорыва в тиках. 100 = 5 секунд.
        # Min: 40
        # Max: 600
        I:dimensionalBreachChargeTicks=100

        # Минимальная стадия Пасти для первого самостоятельного прорыва из обычного мира в Ад или Энд.
        # Прорыв создаёт постоянный органический узел в целевом измерении и расходует один лимит узлов.
        # Min: 1
        # Max: 10
        I:dimensionalBreachMinimumMawLevel=6

        # Min: 0
        # Max: 32
        I:dispatcherSummonActiveLimit=3

        # Цена, интервал и предел активных подземных слуг Dispatcher IV.
        # Min: 0
        # Max: 1000000
        I:dispatcherSummonBiomassCost=140

        # Min: 100
        # Max: 24000
        I:dispatcherSummonIntervalTicks=700

        # Длительность рождения Багровой Пасти после подтверждения в тиках. 120 = 6 секунд.
        # Min: 40
        # Max: 400
        I:dormantSeedBirthAnimationTicks=120

        # Разрешить естественное появление Спящего зачатка в сундуках с таблицей добычи.
        B:dormantSeedCanAppearNaturally=true

        # Вероятность появления зачатка при открытии подходящего сундука: 1.0 = 100%, 0.25 = 25%.
        # Min: 0.0
        # Max: 1.0
        D:dormantSeedChestChance=1.0

        # Перед пробуждением показывать многоэтапный интерфейс Багрового завета по принципу Trustworthy Note.
        B:dormantSeedConfirmationEnabled=true

        # Количество последовательных предупреждений в интерфейсе Багрового завета перед финальной кнопкой.
        # Min: 0
        # Max: 3
        I:dormantSeedConfirmationWarnings=3

        # Конец собственного окна времени мира для CUSTOM. Диапазон может проходить через 0, например 18000–6000.
        # Min: 0
        # Max: 23999
        I:dormantSeedCustomTimeEnd=23000

        # Начало собственного окна времени мира для CUSTOM. 0 = рассвет, 12000 = закат, 18000 = полночь.
        # Min: 0
        # Max: 23999
        I:dormantSeedCustomTimeStart=13000

        # Максимальный Bloom Вагранта для появления и использования Спящего зачатка. Значение 1 делает условие строго Bloom I.
        # Min: 0
        # Max: 20
        I:dormantSeedMaximumBloom=1

        # Минимальный Bloom Вагранта для появления и использования Спящего зачатка.
        # Min: 0
        # Max: 20
        I:dormantSeedMinimumBloom=1

        # Минимальная текущая фаза паразитов для появления и использования Спящего зачатка.
        # Min: -2
        # Max: 10
        I:dormantSeedMinimumPhase=1

        # Использовать только естественные сундуки, у которых ещё не была развёрнута таблица добычи. Защищает от фарма через поставленные игроками сундуки.
        B:dormantSeedOnlyGeneratedLootChests=true

        # Время суток, когда Спящий зачаток может появиться и быть пробуждён:
        # ANY — всегда; DAY — только днём; NIGHT — только ночью, как Trustworthy Note;
        # CUSTOM — собственный диапазон тиков ниже.
        # Valid values:
        # ANY
        # DAY
        # NIGHT
        # CUSTOM
        S:dormantSeedTimeWindow=NIGHT

        # Для DAY, NIGHT и CUSTOM требовать измерение с нормальной сменой дня и ночи, как у Trustworthy Note.
        B:dormantSeedTimedWindowRequiresSurfaceWorld=true

        # Разрешить пробуждение Пасти использованием Спящего зачатка.
        B:dormantSeedUseable=true

        # После первого успешного пробуждения Пасти необратимо превращать все остальные Спящие зачатки в Высохшие.
        B:dryAllSeedsAfterActivation=true

        # Включить предмет переносимой биомассы и живую Багровую Пасть.
        B:enabled=true

        # Цена первого прорыва в Энд из хранилища основной Пасти.
        # Min: 0
        # Max: 2000000000
        I:endBreachBiomassCost=30000

        # Разрешать только одну активную основную Багровую Пасть на владельца во всех измерениях.
        B:enforceSinglePrimaryMaw=true

        # Включить накопительные боевые мутации стадий IV-X.
        B:evolvedAbilitiesEnabled=true

        # Полная длительность анимации захвата и проглатывания в тиках.
        # Min: 30
        # Max: 200
        I:feedingAnimationTicks=64

        # Базовая биомасса за полностью переваренного моба.
        # Min: 0
        # Max: 1000000
        I:feedingBaseBiomass=5

        # Радиус захвата на первой стадии.
        # Min: 1.0
        # Max: 32.0
        D:feedingBaseRadius=4.0

